    <title>Open Code</title>
    <script>
      // Apply stored theme/locale before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem("oc-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          var locale = localStorage.getItem("oc-locale");
          if (locale !== "fa" && locale !== "en") locale = "fa";
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "fa" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/fonts/Vazirmatn-Variable.woff2") format("woff2 supports variations"),
             url("assets/fonts/Vazirmatn-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-display: swap;
      }
      /* boot splash */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: #f7f8fb; z-index: 999; transition: opacity .25s; }
      html.dark #boot { background: #0a0c12; }
      #boot .b-logo { width: 76px; height: 76px; border-radius: 22px;
        box-shadow: 0 24px 60px -18px rgba(79, 70, 229, .55); animation: bpulse 1.4s ease-in-out infinite; }
      @keyframes bpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      #boot .b-name { position: absolute; margin-top: 130px; font-weight: 800; color: #12151f;
        font-family: "Vazirmatn", sans-serif; font-size: 17px; }
      html.dark #boot .b-name { color: #eceef4; }
    </style>
  </head>
  <body>

      <div class="b-name">Open Code</div>

    <script src="assets/js/ui-github.js?v=1.0.5.1794692789"></script>
    <script>
      (function () {
        var ok = false;
        try {
          if (window.OC && typeof OC.boot === "function") { OC.boot(); ok = true; }
        } catch (e) { console.error(e); }
        var b = document.getElementById("boot");
        if (ok) {
          if (b) { b.style.opacity = "0"; setTimeout(function () { b.remove(); }, 300); }
        } else {
          // never leave a blank screen: old WebView / failed scripts / no network
          if (b) {
            b.innerHTML = '<div style="text-align:center;padding:24px;direction:rtl">' +
              '<div style="font-size:16px;font-weight:800;margin-bottom:10px">برنامه بارگذاری نشد</div>' +
              '<div style="font-size:13.5px;line-height:2;opacity:.85">WebView این دستگاه قدیمی است یا اتصال برقرار نشده.<br>از Chrome به‌روز استفاده کنید و یک بار صفحه را رفرش کنید.</div>' +
              '<button onclick="location.reload()" style="margin-top:16px;padding:11px 26px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:15px">تلاش مجدد</button></div>';
          }
          return;
        }
        // PWA service worker (skip on local dev hosts)
        var isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
        if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !isLocal) {
          navigator.serviceWorker.register("sw.js").catch(function (e) { /* offline shell optional */ });
        } else if ("serviceWorker" in navigator && isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
        }
        // PWA install prompt
        var deferredPrompt = null;
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          deferredPrompt = e;
        });
        OC.installPWA = function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
          }
        };
      })();
    </script>
  </body>
