name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Open Code, OU=Mobile, O=OpenCode, L=Tehran, C=IR"

      - name: Prepare TWA project
        run: |
          mkdir -p twa && cd twa
          # Write config so bubblewrap knows jdk + sdk paths
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

          python3 - <<'PY'
          import json, os
          m = json.load(open("../twa-manifest.json"))
          m["signingKey"] = {
            "path": os.environ["GITHUB_WORKSPACE"] + "/android.keystore",
            "alias": "android"
          }
          # Ensure host/startUrl match live site
          m["host"] = "arani2020-lgtm.github.io"
          m["startUrl"] = "/open-code-app/"
          m["fullScopeUrl"] = "https://arani2020-lgtm.github.io/open-code-app/"
          m["webManifestUrl"] = "https://arani2020-lgtm.github.io/open-code-app/manifest.webmanifest"
          m["iconUrl"] = "https://arani2020-lgtm.github.io/open-code-app/assets/icons/icon-512.png"
          m["maskableIconUrl"] = "https://arani2020-lgtm.github.io/open-code-app/assets/icons/icon-maskable-512.png"
          json.dump(m, open("twa-manifest.json", "w"), indent=2)
          print("twa-manifest ready")
          PY

          # Generate Android project from twa-manifest (no interactive prompts if config exists)
          set +e
          bubblewrap update --skipPwaValidation 2>&1
          # If update needs project, try init once
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            bubblewrap init \
              --manifest=https://arani2020-lgtm.github.io/open-code-app/manifest.webmanifest \
              --directory=. \
              --skipPwaValidation true 2>&1 <<ANSWERS
n
n
n
n
n
ANSWERS
          fi
          # Keep our manifest/signing
          python3 - <<'PY'
          import json, os
          m = json.load(open("../twa-manifest.json"))
          m["signingKey"] = {
            "path": os.environ["GITHUB_WORKSPACE"] + "/android.keystore",
            "alias": "android"
          }
          json.dump(m, open("twa-manifest.json", "w"), indent=2)
          PY
          ls -la
          find . -maxdepth 3 -type f | head -40
          set -e

      - name: Build APK
        working-directory: twa
        run: |
          set +e
          bubblewrap build \
            --skipPwaValidation \
            --storePassword android \
            --keyPassword android 2>&1
          echo "bubblewrap exit: $?"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=android \
              -Pandroid.injected.signing.key.password=android 2>&1
            echo "gradle release exit: $?"
            ./gradlew assembleDebug 2>&1
            echo "gradle debug exit: $?"
          fi

          echo "=== APK files ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f -print
          set -e
          # Fail the job if no apk was produced
          count=$(find "$GITHUB_WORKSPACE" -name "*.apk" -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No APK produced"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-code-apk
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 14
