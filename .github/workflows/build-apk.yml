name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Open Code, OU=Mobile, O=OpenCode, L=Tehran, C=IR"

      - name: Write bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Prepare TWA folder
        run: |
          mkdir -p twa
          python3 -c "
          import json, os
          m = json.load(open('twa-manifest.json'))
          m['signingKey'] = {'path': os.environ['GITHUB_WORKSPACE'] + '/android.keystore', 'alias': 'android'}
          m['host'] = 'arani2020-lgtm.github.io'
          m['startUrl'] = '/open-code-app/'
          m['fullScopeUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/'
          m['webManifestUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/manifest.webmanifest'
          m['iconUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/assets/icons/icon-512.png'
          m['maskableIconUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/assets/icons/icon-maskable-512.png'
          json.dump(m, open('twa/twa-manifest.json', 'w'), indent=2)
          print('ok')
          "

      - name: Bubblewrap init
        working-directory: twa
        run: |
          set +e
          echo n | bubblewrap update --skipPwaValidation
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ] && [ ! -f build.gradle ]; then
            yes n | bubblewrap init --manifest=https://arani2020-lgtm.github.io/open-code-app/manifest.webmanifest --directory=. --skipPwaValidation true
          fi
          ls -la
          find . -maxdepth 4 -type f | head -50
          set -e

      - name: Bubblewrap / Gradle build
        working-directory: twa
        run: |
          set +e
          yes n | bubblewrap build --skipPwaValidation --storePassword android --keyPassword android
          echo bubblewrap_exit:$?
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=android \
              -Pandroid.injected.signing.key.password=android
            echo gradle_release_exit:$?
            ./gradlew assembleDebug
            echo gradle_debug_exit:$?
          fi
          find "$GITHUB_WORKSPACE" -name '*.apk' -type f -print
          set -e

      - name: Sign APK (jarsigner + apksigner)
        run: |
          set -e
          mkdir -p dist
          # Prefer any existing signed release, else take unsigned and sign it
          CANDIDATE=$(find "$GITHUB_WORKSPACE" -name '*-release*.apk' -type f | head -1)
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(find "$GITHUB_WORKSPACE" -name '*.apk' -type f | head -1)
          fi
          if [ -z "$CANDIDATE" ]; then
            echo "No APK found to sign"
            exit 1
          fi
          echo "Source APK: $CANDIDATE"
          cp "$CANDIDATE" dist/OpenCode-unsigned.apk

          # jarsigner (v1) always available with JDK
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -storepass android -keypass android \
            dist/OpenCode-unsigned.apk android

          # zipalign + apksigner when build-tools exist (v2/v3)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "$BT/zipalign" ] && [ -x "$BT/apksigner" ]; then
            echo "Using build-tools: $BT"
            "$BT/zipalign" -f -p 4 dist/OpenCode-unsigned.apk dist/OpenCode-aligned.apk
            "$BT/apksigner" sign \
              --ks "$GITHUB_WORKSPACE/android.keystore" \
              --ks-key-alias android \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out dist/OpenCode-1.6.4-release.apk \
              dist/OpenCode-aligned.apk
            "$BT/apksigner" verify --verbose dist/OpenCode-1.6.4-release.apk || true
          else
            echo "apksigner not found — shipping jarsigner-signed APK"
            cp dist/OpenCode-unsigned.apk dist/OpenCode-1.6.4-release.apk
          fi

          # Also keep a debug copy if present
          DEBUG=$(find "$GITHUB_WORKSPACE" -name '*-debug*.apk' -type f | head -1 || true)
          if [ -n "$DEBUG" ]; then
            cp "$DEBUG" dist/OpenCode-debug.apk
          fi

          ls -la dist/
          test -f dist/OpenCode-1.6.4-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: open-code-apk
          path: |
            dist/OpenCode-1.6.4-release.apk
            dist/OpenCode-debug.apk
          if-no-files-found: error
          retention-days: 30
