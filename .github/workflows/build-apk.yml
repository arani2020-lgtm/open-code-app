name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Open Code, OU=Mobile, O=OpenCode, L=Tehran, C=IR"

      - name: Write bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Prepare TWA folder
        run: |
          mkdir -p twa
          python3 -c "
          import json, os
          m = json.load(open('twa-manifest.json'))
          m['signingKey'] = {'path': os.environ['GITHUB_WORKSPACE'] + '/android.keystore', 'alias': 'android'}
          m['host'] = 'arani2020-lgtm.github.io'
          m['startUrl'] = '/open-code-app/'
          m['fullScopeUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/'
          m['webManifestUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/manifest.webmanifest'
          m['iconUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/assets/icons/icon-512.png'
          m['maskableIconUrl'] = 'https://arani2020-lgtm.github.io/open-code-app/assets/icons/icon-maskable-512.png'
          json.dump(m, open('twa/twa-manifest.json', 'w'), indent=2)
          print('ok')
          "

      - name: Bubblewrap init
        working-directory: twa
        run: |
          set +e
          echo n | bubblewrap update --skipPwaValidation
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ] && [ ! -f build.gradle ]; then
            yes n | bubblewrap init --manifest=https://arani2020-lgtm.github.io/open-code-app/manifest.webmanifest --directory=. --skipPwaValidation true
          fi
          ls -la
          find . -maxdepth 4 -type f | head -50
          set -e

      - name: Bubblewrap build
        working-directory: twa
        run: |
          set +e
          yes n | bubblewrap build --skipPwaValidation --storePassword android --keyPassword android
          echo bubblewrap_exit:$?
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
            echo gradle_exit:$?
          fi
          find "$GITHUB_WORKSPACE" -name '*.apk' -type f -print
          set -e
          test "$(find "$GITHUB_WORKSPACE" -name '*.apk' -type f | wc -l)" -gt 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-code-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 14
